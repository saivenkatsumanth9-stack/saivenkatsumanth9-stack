<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 200" width="100%" height="200" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;family=Orbitron:wght@700;900&amp;display=swap');

    @keyframes radar-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    .mono { font-family: 'JetBrains Mono', monospace; }
    .orbitron { font-family: 'Orbitron', -apple-system, sans-serif; }
    .radar { animation: radar-spin 10s linear infinite; transform-origin: 980px 100px; }
    .pulse { animation: pulse-dot 2s ease-in-out infinite; transform-origin: center; }
  </style>

  <defs>
    <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#0a0d1a"/>
      <stop offset="100%" stop-color="#04060c"/>
    </linearGradient>

    <linearGradient id="card-surface-proj" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1222"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="beam-laser" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#bd00ff" stop-opacity="0.8"/>
    </linearGradient>

    <radialGradient id="radar-sweep" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="proj-clip">
      <rect width="1100" height="200" rx="8"/>
    </clipPath>
  </defs>

  <!-- Base Canvas -->
  <rect width="1100" height="200" rx="8" fill="url(#proj-bg)" stroke="#1a233a" stroke-width="1.2"/>

  <!-- Top Title & Badge -->
  <g transform="translate(30, 32)">
    <circle cx="8" cy="8" r="4.5" fill="#22c55e" class="pulse"/>
    <text x="24" y="12" class="mono" font-size="14" fill="#ffffff" font-weight="800" letter-spacing="1.5">
      MISSION_CONTROL // PRODUCTION SYSTEMS &amp; DEPLOYMENTS
    </text>
    <text x="24" y="28" class="mono" font-size="9" fill="#64748b" letter-spacing="1">
      REAL-WORLD ARCHITECTURES • DETERMINISTIC ENGINES • ZERO FABRICATED CLAIMS
    </text>
  </g>

  <!-- Telemetry Metrics Grid (3 Pill Cards) -->
  <g transform="translate(30, 80)">
    <!-- Metric 1: Verified Deployments -->
    <g>
      <rect width="260" height="85" rx="6" fill="url(#card-surface-proj)" stroke="#22c55e" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#22c55e"/>
      <text x="32" y="25" class="mono" font-size="9" fill="#22c55e" font-weight="700">01 // GOVTECH &amp; SAAS</text>
      <text x="20" y="52" class="orbitron" font-size="20" fill="#f8fafc" font-weight="900">BENEFITX</text>
      <text x="20" y="72" class="mono" font-size="9" fill="#94a3b8">17 Routes · 5 Engines · 40/40 Tests</text>
    </g>

    <!-- Metric 2: Vision & 3D -->
    <g transform="translate(280, 0)">
      <rect width="260" height="85" rx="6" fill="url(#card-surface-proj)" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#00f2fe"/>
      <text x="32" y="25" class="mono" font-size="9" fill="#00f2fe" font-weight="700">02 // COMPUTER VISION 3D</text>
      <text x="20" y="52" class="orbitron" font-size="20" fill="#f8fafc" font-weight="900">HANDSCAPE</text>
      <text x="20" y="72" class="mono" font-size="9" fill="#94a3b8">MediaPipe 60fps · 11 Gestures · Web Audio</text>
    </g>

    <!-- Metric 3: Agentic AI -->
    <g transform="translate(560, 0)">
      <rect width="260" height="85" rx="6" fill="url(#card-surface-proj)" stroke="#bd00ff" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="20" cy="22" r="3.5" fill="#bd00ff"/>
      <text x="32" y="25" class="mono" font-size="9" fill="#bd00ff" font-weight="700">03 // AUTONOMOUS SYSTEMS</text>
      <text x="20" y="52" class="orbitron" font-size="20" fill="#f8fafc" font-weight="900">ReAct AGENT</text>
      <text x="20" y="72" class="mono" font-size="9" fill="#94a3b8">Safe AST · 5 Tools · Offline-Safe</text>
    </g>
  </g>

  <!-- Right Side Cyber Radar Indicator -->
  <g transform="translate(860, 20)">
    <rect width="210" height="150" rx="6" fill="#090d18" stroke="#1a233a" stroke-width="1"/>
    <text x="16" y="24" class="mono" font-size="8.5" fill="#64748b" font-weight="700" letter-spacing="1">LIVE TELEMETRY RADAR</text>
    
    <!-- Radar Circles -->
    <circle cx="105" cy="85" r="45" stroke="#1e293b" stroke-width="1" fill="none"/>
    <circle cx="105" cy="85" r="30" stroke="#1e293b" stroke-width="0.8" fill="none"/>
    <circle cx="105" cy="85" r="15" stroke="#00f2fe" stroke-opacity="0.4" stroke-width="0.8" fill="none"/>
    <circle cx="105" cy="85" r="2.5" fill="#22c55e"/>

    <!-- Radar Crosshairs -->
    <line x1="60" y1="85" x2="150" y2="85" stroke="#1e293b" stroke-width="0.8"/>
    <line x1="105" y1="40" x2="105" y2="130" stroke="#1e293b" stroke-width="0.8"/>

    <!-- Rotating Radar Sweep -->
    <g class="radar" transform-origin="105px 85px">
      <path d="M 105 85 L 150 85 A 45 45 0 0 1 136 116 Z" fill="url(#radar-sweep)"/>
    </g>

    <!-- Radar Target Nodes -->
    <circle cx="125" cy="65" r="2" fill="#22c55e" class="pulse"/>
    <circle cx="85" cy="100" r="2" fill="#00f2fe" class="pulse"/>
    <circle cx="130" cy="105" r="2" fill="#bd00ff" class="pulse"/>

    <text x="16" y="142" class="mono" font-size="8" fill="#22c55e">TARGETS: 6/6 VERIFIED ONLINE</text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="30" y1="182" x2="1070" y2="182" stroke="url(#beam-laser)" stroke-width="0.8"/>
</svg>
