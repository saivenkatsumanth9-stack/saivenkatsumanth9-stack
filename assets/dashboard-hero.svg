<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;900&amp;display=swap');
text{font-family:'JetBrains Mono','Fira Code',monospace}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.9}}
@keyframes scanV{0%{transform:translateY(-340px)}100%{transform:translateY(340px)}}
@keyframes borderGlow{0%,100%{stroke-opacity:.1}50%{stroke-opacity:.4}}
@keyframes typewriter{0%{width:0}100%{width:290px}}
@keyframes dotFloat{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(-4px);opacity:.4}}
@keyframes statusPulse{0%,100%{fill:#00ff41;opacity:.5}50%{fill:#00ff41;opacity:1}}
.bk{animation:blink 1s step-end infinite}
.pl{animation:pulse 2.5s ease-in-out infinite}
.sc{animation:scanV 8s linear infinite;opacity:.04}
.bg{animation:borderGlow 4s ease-in-out infinite}
.df{animation:dotFloat 5s ease-in-out infinite}
.sp{animation:statusPulse 2s ease-in-out infinite}
</style>
<filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/><feFlood flood-color="#00ff41" flood-opacity=".3"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="textGlow" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="1.5"/><feFlood flood-color="#00ff41" flood-opacity=".2"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Background -->
<rect width="1200" height="340" fill="#0a0a0a"/>

<!-- Subtle grid pattern -->
<g opacity=".025" stroke="#00ff41" stroke-width=".5">
<line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
<line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="160" x2="1200" y2="160"/>
<line x1="0" y1="200" x2="1200" y2="200"/><line x1="0" y1="240" x2="1200" y2="240"/>
<line x1="0" y1="280" x2="1200" y2="280"/><line x1="0" y1="320" x2="1200" y2="320"/>
<line x1="40" y1="0" x2="40" y2="340"/><line x1="80" y1="0" x2="80" y2="340"/>
<line x1="400" y1="0" x2="400" y2="340"/><line x1="440" y1="0" x2="440" y2="340"/>
