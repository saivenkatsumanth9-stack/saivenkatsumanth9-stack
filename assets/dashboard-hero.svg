<circle cx="60" cy="20" r="3" fill="#00ff41" class="np" style="animation-delay:.2s"/>
<circle cx="60" cy="60" r="3" fill="#00ff41" class="np" style="animation-delay:.5s"/>
<circle cx="60" cy="100" r="3" fill="#00ff41" class="np" style="animation-delay:.8s"/>
