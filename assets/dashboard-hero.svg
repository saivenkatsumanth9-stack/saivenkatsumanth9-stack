<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;900&amp;display=swap');
text{font-family:'JetBrains Mono','Fira Code',monospace}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
@keyframes scan{0%{transform:translateY(-400px)}100%{transform:translateY(400px)}}
@keyframes borderFlow{0%{stroke-dashoffset:60}100%{stroke-dashoffset:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes orbit{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes waveform1{0%,100%{transform:scaleY(.3)}25%{transform:scaleY(1)}50%{transform:scaleY(.5)}75%{transform:scaleY(.8)}}
@keyframes waveform2{0%,100%{transform:scaleY(.6)}25%{transform:scaleY(.3)}50%{transform:scaleY(.9)}75%{transform:scaleY(.4)}}
@keyframes waveform3{0%,100%{transform:scaleY(.8)}25%{transform:scaleY(.4)}50%{transform:scaleY(.3)}75%{transform:scaleY(1)}}
@keyframes glowPulse{0%,100%{filter:drop-shadow(0 0 2px rgba(0,255,65,.2))}50%{filter:drop-shadow(0 0 8px rgba(0,255,65,.5))}}
@keyframes typeIn{0%{opacity:0}5%{opacity:1}95%{opacity:1}100%{opacity:0}}
@keyframes nodeP{0%,100%{r:3;opacity:.3}50%{r:5;opacity:.8}}
@keyframes dataFlow{0%{stroke-dashoffset:30}100%{stroke-dashoffset:0}}
@keyframes hexSpin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
@keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
.bk{animation:blink 1s step-end infinite}
.pl{animation:pulse 3s ease-in-out infinite}
.sc{animation:scan 7s linear infinite;opacity:.03}
.bf{stroke-dasharray:12 8;animation:borderFlow 3s linear infinite}
.fl{animation:float 5s ease-in-out infinite}
.w1{animation:waveform1 2s ease-in-out infinite;transform-origin:center bottom}
.w2{animation:waveform2 2.3s ease-in-out infinite;transform-origin:center bottom}
.w3{animation:waveform3 1.8s ease-in-out infinite;transform-origin:center bottom}
.gp{animation:glowPulse 3s ease-in-out infinite}
.np{animation:nodeP 2.5s ease-in-out infinite}
.df{animation:dataFlow 2s linear infinite}
</style>
<filter id="glow"><feGaussianBlur stdDeviation="4"/><feFlood flood-color="#00ff41" flood-opacity=".3"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="glowSm"><feGaussianBlur stdDeviation="2"/><feFlood flood-color="#00ff41" flood-opacity=".25"/><feComposite in2="blur" operator="in"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-opacity=".4"/></filter>
<linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#00ff41" stop-opacity=".8"/>
<stop offset="50%" stop-color="#ffffff"/>
<stop offset="100%" stop-color="#00ff41" stop-opacity=".8"/>
</linearGradient>
<radialGradient id="centerGlow" cx="50%" cy="45%" r="40%">
<stop offset="0%" stop-color="#00ff41" stop-opacity=".04"/>
<stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
</radialGradient>
</defs>

<!-- Background -->
<rect width="1200" height="400" fill="#050505"/>
<rect width="1200" height="400" fill="url(#centerGlow)"/>

<!-- Grid -->
<g opacity=".02" stroke="#00ff41" stroke-width=".4">
<line x1="0" y1="0" x2="0" y2="400"/><line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/>
<line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
<line x1="1040" y1="0" x2="1040" y2="400"/><line x1="1080" y1="0" x2="1080" y2="400"/>
<line x1="1120" y1="0" x2="1120" y2="400"/><line x1="1160" y1="0" x2="1160" y2="400"/><line x1="1200" y1="0" x2="1200" y2="400"/>
<line x1="0" y1="40" x2="1200" y2="40"/><line x1="0" y1="80" x2="1200" y2="80"/>
<line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="360" x2="1200" y2="360"/>
</g>

<!-- Scanline -->
<rect x="0" y="0" width="1200" height="2" fill="#00ff41" class="sc"/>
<!-- Top/Bottom accent -->
<rect x="0" y="0" width="1200" height="1" fill="#00ff41" opacity=".5"/>
<rect x="0" y="399" width="1200" height="1" fill="#00ff41" opacity=".3"/>

