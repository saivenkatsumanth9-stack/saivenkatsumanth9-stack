<g transform="translate(30, 330)" opacity=".25">
<rect class="w1" x="0" y="0" width="4" height="30" rx="1" fill="#00ff41"/><rect class="w2" x="7" y="0" width="4" height="30" rx="1" fill="#00ff41"/>
<rect class="w3" x="14" y="0" width="4" height="30" rx="1" fill="#00ff41"/><rect class="w1" x="21" y="0" width="4" height="30" rx="1" fill="#00ff41" style="animation-delay:.2s"/>
