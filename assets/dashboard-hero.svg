<line x1="3" y1="40" x2="57" y2="20"/><line x1="3" y1="40" x2="57" y2="60"/><line x1="3" y1="40" x2="57" y2="100"/>
<line x1="3" y1="80" x2="57" y2="60"/><line x1="3" y1="80" x2="57" y2="100"/><line x1="3" y1="80" x2="57" y2="140"/>
<line x1="3" y1="120" x2="57" y2="100"/><line x1="3" y1="120" x2="57" y2="140"/>
<line x1="3" y1="160" x2="57" y2="140"/>
<line x1="63" y1="20" x2="117" y2="40"/><line x1="63" y1="20" x2="117" y2="80"/>
<line x1="63" y1="60" x2="117" y2="40"/><line x1="63" y1="60" x2="117" y2="80"/><line x1="63" y1="60" x2="117" y2="120"/>
<line x1="63" y1="100" x2="117" y2="80"/><line x1="63" y1="100" x2="117" y2="120"/>
<line x1="63" y1="140" x2="117" y2="120"/>
<line x1="123" y1="40" x2="176" y2="60"/><line x1="123" y1="40" x2="176" y2="100"/>
<line x1="123" y1="80" x2="176" y2="60"/><line x1="123" y1="80" x2="176" y2="100"/>
<line x1="123" y1="120" x2="176" y2="100"/>
