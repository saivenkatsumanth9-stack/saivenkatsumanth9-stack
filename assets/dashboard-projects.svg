<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="1200" height="160">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
text{font-family:'JetBrains Mono',monospace}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes flow{0%{stroke-dashoffset:20}100%{stroke-dashoffset:0}}
.p{animation:pulse 2.5s ease-in-out infinite}
.f{stroke-dasharray:4 4;animation:flow 2s linear infinite}
</style>
</defs>
<rect width="1200" height="160" fill="#050505"/>
<rect x="0" y="0" width="1200" height="1" fill="#00ff41" opacity=".3"/>

<!-- Project cards as connected nodes -->
<!-- Card 1: BenefitX -->
<rect x="30" y="20" width="175" height="120" rx="8" fill="rgba(8,8,8,.95)" stroke="rgba(0,255,65,.15)" stroke-width=".8"/>
<circle cx="50" cy="40" r="5" fill="#00ff41" opacity=".6" class="p"/>
<text x="62" y="43" font-size="8" fill="#e8e8e8" font-weight="700">BENEFITX</text>
<text x="162" y="43" font-size="6" fill="#00ff41" text-anchor="end">LIVE</text>
<line x1="40" y1="52" x2="195" y2="52" stroke="rgba(0,255,65,.06)" stroke-width=".5"/>
<text x="40" y="66" font-size="6" fill="#666">Gov benefit navigator</text>
<text x="40" y="78" font-size="6" fill="#666">AI-powered matching</text>
<text x="40" y="96" font-size="5.5" fill="#444">React · TanStack · Supabase</text>
<rect x="40" y="108" width="40" height="12" rx="3" fill="rgba(0,255,65,.06)"/><text x="60" y="117" text-anchor="middle" font-size="5" fill="#00ff41">▸ LIVE</text>
<rect x="85" y="108" width="45" height="12" rx="3" fill="rgba(0,255,65,.06)"/><text x="107" y="117" text-anchor="middle" font-size="5" fill="#00ff41">▸ CODE</text>

<!-- Connection line 1→2 -->
<line x1="205" y1="80" x2="230" y2="80" stroke="#00ff41" stroke-width=".5" class="f"/>

<!-- Card 2: HandScape -->
<rect x="230" y="20" width="175" height="120" rx="8" fill="rgba(8,8,8,.95)" stroke="rgba(0,255,65,.15)" stroke-width=".8"/>
<circle cx="250" cy="40" r="5" fill="#00ff41" opacity=".6" class="p" style="animation-delay:.4s"/>
