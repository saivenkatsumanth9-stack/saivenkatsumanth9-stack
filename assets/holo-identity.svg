<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      
      .text {
        font-family: 'JetBrains Mono', Consolas, monospace;
      }
      
      .card-group {
        transform-origin: 440px 140px;
        transform: perspective(800px) rotateY(-3deg) rotateX(2deg);
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 0.2; transform: scale(0.95); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      
      .circle-pulse-1 {
        animation: pulse 6s ease-in-out infinite;
        transform-origin: 440px 140px;
      }
      
      .circle-pulse-2 {
        animation: pulse 8s ease-in-out infinite alternate;
        transform-origin: 440px 140px;
      }
      
      @keyframes shimmer {
        0% { transform: translateX(-800px) skewX(-20deg); }
        100% { transform: translateX(800px) skewX(-20deg); }
      }
      
      .shimmer {
        animation: shimmer 4s linear infinite;
      }
      
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      
      .blink {
        animation: blink 2s ease-in-out infinite;
      }
      
      @keyframes scan {
        0% { transform: translateY(0px); }
        100% { transform: translateY(220px); }
      }
      
      .scan-line {
        animation: scan 3s linear infinite;
      }
      
      @keyframes pulse-border {
        0%, 100% { stroke-opacity: 0.3; }
        50% { stroke-opacity: 1; }
      }
      
      .avatar-border {
        animation: pulse-border 3s ease-in-out infinite;
      }
    </style>

    <pattern id="dot-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1" fill="#22c55e" fill-opacity="0.05" />
    </pattern>

    <pattern id="avatar-grid" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#22c55e" stroke-width="0.5" stroke-opacity="0.2"/>
    </pattern>
    
    <linearGradient id="shimmer-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent" />
      <stop offset="40%" stop-color="#22c55e" stop-opacity="0.08" />
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="transparent" />
    </linearGradient>

    <!-- Barcode Pattern -->
    <g id="barcode">
      <rect x="0" y="0" width="2" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="4" y="0" width="1" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="7" y="0" width="3" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="12" y="0" width="1" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="15" y="0" width="4" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="21" y="0" width="2" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="25" y="0" width="1" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="28" y="0" width="2" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="32" y="0" width="5" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="39" y="0" width="1" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="42" y="0" width="2" height="20" fill="#06b6d4" fill-opacity="0.5"/>
      <rect x="46" y="0" width="3" height="20" fill="#06b6d4" fill-opacity="0.5"/>
    </g>

    <clipPath id="card-clip">
      <rect x="70" y="30" width="740" height="220" rx="16" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="880" height="280" fill="#080a10" />
  <rect width="880" height="280" fill="url(#dot-grid)" />
  
  <!-- Radiating circles -->
  <circle cx="440" cy="140" r="180" fill="none" stroke="#22c55e" stroke-width="1" class="circle-pulse-1" />
  <circle cx="440" cy="140" r="260" fill="none" stroke="#06b6d4" stroke-width="1" class="circle-pulse-2" />

  <!-- Card Group with 3D Transform -->
  <g class="card-group">
    <!-- Card Background with glow border -->
    <rect x="70" y="30" width="740" height="220" rx="16" fill="#0a0f1a" fill-opacity="0.85" stroke="#22c55e" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Holographic Shimmer and Scan Line inside Clip Path -->
    <g clip-path="url(#card-clip)">
      <rect x="70" y="30" width="400" height="400" fill="url(#shimmer-grad)" class="shimmer" />
      <rect x="70" y="30" width="740" height="1" fill="#06b6d4" fill-opacity="0.3" class="scan-line" />
    </g>

    <!-- Top Left Header -->
    <circle cx="95" cy="55" r="3" fill="#22c55e" class="blink" />
    <text x="105" y="58" class="text" fill="#22c55e" font-size="9" letter-spacing="1">IDENTITY VERIFIED</text>
    
    <!-- Top Right Header -->
    <text x="785" y="58" class="text blink" fill="#06b6d4" font-size="9" letter-spacing="1" text-anchor="end">CLEARANCE: LEVEL 5</text>
    <path d="M 785 64 L 705 64 L 695 54 L 690 54" fill="none" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.3" />

    <!-- Left Side: Avatar -->
    <rect x="130" y="90" width="80" height="80" rx="8" fill="url(#avatar-grid)" stroke="#22c55e" stroke-width="1.5" class="avatar-border" />
    <text x="170" y="195" class="text" fill="#94a3b8" font-size="10" text-anchor="middle" letter-spacing="1">ID: SVK-2027</text>

    <!-- Vertical Divider -->
    <line x1="250" y1="80" x2="250" y2="200" stroke="#22c55e" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 4" />

    <!-- Right Side: Data Readout -->
    <text x="280" y="105" class="text" fill="#f8fafc" font-size="14" font-weight="bold" letter-spacing="1">PEDDI SAI VENKAT SUMANTH</text>
    <text x="280" y="125" class="text" fill="#22c55e" font-size="11" letter-spacing="0.5">CALLSIGN: SUMANTH</text>
    
    <text x="280" y="148" class="text" fill="#94a3b8" font-size="10">▸ ROLE: Software Engineer &amp; AI Systems Builder</text>
    <text x="280" y="166" class="text" fill="#94a3b8" font-size="10">▸ ORG: NNRES • B.Tech CSE • 2023-2027</text>
    <text x="280" y="184" class="text" fill="#94a3b8" font-size="10">▸ SECTOR: Hyderabad, IN [17.38°N, 78.49°E]</text>
    <text x="280" y="202" class="text" fill="#22c55e" font-size="10">▸ STATUS: 🟢 ACTIVE — Seeking Internships</text>

    <!-- Decorative Elements -->
    <path d="M 70 46 L 70 40 Q 70 30 80 30 L 90 30" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.8" />
    <path d="M 810 234 L 810 240 Q 810 250 800 250 L 790 250" fill="none" stroke="#22c55e" stroke-width="2" stroke-opacity="0.8" />
    
    <use href="#barcode" x="750" y="205" />
  </g>
</svg>
