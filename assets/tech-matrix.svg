<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&amp;display=swap');
    
    @keyframes pulse-cyan {
      0%, 100% { opacity: 0.9; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    @keyframes card-glow {
      0%, 100% { stroke-opacity: 0.4; }
      50% { stroke-opacity: 0.9; }
    }
    @keyframes line-flow {
      0% { stroke-dashoffset: 40; }
      100% { stroke-dashoffset: 0; }
    }

    .mono { font-family: 'JetBrains Mono', monospace; }
    .pulse { animation: pulse-cyan 2.5s ease-in-out infinite; transform-origin: center; }
    .card-border { animation: card-glow 4s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 4 4; animation: line-flow 6s linear infinite; }
  </style>

  <defs>
    <linearGradient id="matrix-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060810"/>
      <stop offset="50%" stop-color="#090d18"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#080b14"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <linearGradient id="magenta-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>

    <clipPath id="matrix-clip">
      <rect width="1100" height="480" rx="8"/>
    </clipPath>
  </defs>

