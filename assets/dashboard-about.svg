<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" width="1200" height="220">

<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&amp;display=swap');
text{font-family:'JetBrains Mono','Fira Code',monospace}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes scan{0%{transform:translateY(-400px)}100%{transform:translateY(400px)}}
@keyframes flow{0%{stroke-dashoffset:40}100%{stroke-dashoffset:0}}
@keyframes dashDraw{0%{stroke-dashoffset:600}100%{stroke-dashoffset:0}}
@keyframes nodePulse{0%,100%{r:3;opacity:.5}50%{r:4.8;opacity:1}}
.pl{animation:pulse 3s ease-in-out infinite}
.sc{animation:scan 9s linear infinite;opacity:.035}
.flw{stroke-dasharray:6 6;animation:flow 2.5s linear infinite}
.dd{stroke-dasharray:600;animation:dashDraw 3s ease-out forwards}
.np{animation:nodePulse 2.6s ease-in-out infinite}
</style>
<filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="shadow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".65"/></filter>
<linearGradient id="glassBg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0f1511" stop-opacity=".88"/>
  <stop offset="50%" stop-color="#080b09" stop-opacity=".92"/>
  <stop offset="100%" stop-color="#0b100d" stop-opacity=".86"/>
</linearGradient>
<linearGradient id="glassRim" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#00ff41" stop-opacity=".35"/>
  <stop offset="35%" stop-color="#ffffff" stop-opacity=".12"/>
  <stop offset="70%" stop-color="#00ff41" stop-opacity=".08"/>
  <stop offset="100%" stop-color="#00ff41" stop-opacity=".28"/>
</linearGradient>
<linearGradient id="glassShine" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#ffffff" stop-opacity=".08"/>
  <stop offset="45%" stop-color="#ffffff" stop-opacity=".02"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
</linearGradient>
<linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0%" stop-color="#00ff41" stop-opacity=".32"/>
  <stop offset="100%" stop-color="#00ff41" stop-opacity=".01"/>
</linearGradient>
<radialGradient id="ambient" cx="50%" cy="50%" r="55%">
  <stop offset="0%" stop-color="#00ff41" stop-opacity=".07"/>
  <stop offset="100%" stop-color="#00ff41" stop-opacity="0"/>
</radialGradient>
</defs>

<rect width="1200" height="220" fill="#030303"/>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r=".6" fill="#00ff41" opacity=".12"/></pattern>
<rect width="1200" height="220" fill="url(#dots)"/>

<g filter="url(#shadow)">
  <rect x="12" y="10" width="720" height="200" rx="14" fill="url(#glassBg)" stroke="url(#glassRim)" stroke-width="1"/>
  <rect x="13" y="11" width="718" height="48.0" rx="13" fill="url(#glassShine)"/>
  <rect x="12" y="10" width="720" height="200" rx="14" fill="url(#ambient)"/>
  <line x1="26" y1="10.5" x2="718" y2="10.5" stroke="#ffffff" stroke-opacity=".18" stroke-width=".7"/>
</g>

<text x="36" y="42" font-size="9" fill="#00ff41" letter-spacing="2" opacity=".85">▸ PROFILE_SPEC // SYSTEM_ARCHITECT</text>
<text x="36" y="70" font-size="20" fill="#f0f0f0" font-weight="800" letter-spacing="1">PEDDI SAI VENKAT SUMANTH</text>
<text x="36" y="92" font-size="11" fill="#00ff41" font-weight="600">AI Engineer · Full-Stack Builder · Cloud &amp; Data Explorer</text>
<line x1="36" y1="106" x2="708" y2="106" stroke="rgba(0,255,65,0.12)" stroke-width="1"/>
<text x="36" y="128" font-size="10.5" fill="#b4b4b4">I engineer practical software systems across Agentic AI, RAG pipelines,</text>
<text x="36" y="146" font-size="10.5" fill="#b4b4b4">full-stack web apps, cloud infrastructure, and interactive 3D experiences.</text>
<text x="36" y="164" font-size="10.5" fill="#8f8f8f">B.Tech CSE (2027) · Nalla Narasimha Reddy Group of Institutions, Hyderabad</text>
<g transform="translate(36, 178)">
  <rect x="0" y="0" width="142" height="20" rx="5" fill="rgba(0,255,65,0.08)" stroke="rgba(0,255,65,0.28)" stroke-width=".7"/>
  <text x="71" y="13.5" text-anchor="middle" font-size="8.5" fill="#00ff41" font-weight="600">22 PUBLIC REPOS</text>
  <rect x="152" y="0" width="122" height="20" rx="5" fill="rgba(0,255,65,0.08)" stroke="rgba(0,255,65,0.28)" stroke-width=".7"/>
  <text x="213" y="13.5" text-anchor="middle" font-size="8.5" fill="#00ff41" font-weight="600">54 TOTAL STARS</text>
  <rect x="284" y="0" width="132" height="20" rx="5" fill="rgba(0,255,65,0.08)" stroke="rgba(0,255,65,0.28)" stroke-width=".7"/>
  <text x="350" y="13.5" text-anchor="middle" font-size="8.5" fill="#00ff41" font-weight="600">10+ CERTS &amp; CAD</text>
  <rect x="426" y="0" width="128" height="20" rx="5" fill="rgba(0,255,65,0.08)" stroke="rgba(0,255,65,0.28)" stroke-width=".7"/>
  <text x="490" y="13.5" text-anchor="middle" font-size="8.5" fill="#00ff41" font-weight="600">80+ LEETCODE</text>
</g>


<g filter="url(#shadow)">
  <rect x="748" y="10" width="440" height="200" rx="14" fill="url(#glassBg)" stroke="url(#glassRim)" stroke-width="1"/>
  <rect x="749" y="11" width="438" height="48.0" rx="13" fill="url(#glassShine)"/>
  <rect x="748" y="10" width="440" height="200" rx="14" fill="url(#ambient)"/>
  <line x1="762" y1="10.5" x2="1174" y2="10.5" stroke="#ffffff" stroke-opacity=".18" stroke-width=".7"/>
</g>

<text x="770" y="40" font-size="9" fill="#00ff41" letter-spacing="2" opacity=".85">▸ ACTIVE_FOCUS_MODULES</text>
<g transform="translate(770, 56)">
  <rect x="0" y="0" width="190" height="42" rx="8" fill="rgba(255,255,255,0.025)" stroke="rgba(0,255,65,0.16)" stroke-width=".7"/>
  <text x="12" y="17" font-size="9" fill="#e8e8e8" font-weight="700">AI &amp; Agentic Systems</text>
  <text x="12" y="32" font-size="8" fill="#7c9682">RAG · LangChain · ReAct</text>

  <rect x="204" y="0" width="190" height="42" rx="8" fill="rgba(255,255,255,0.025)" stroke="rgba(0,255,65,0.16)" stroke-width=".7"/>
  <text x="216" y="17" font-size="9" fill="#e8e8e8" font-weight="700">Full-Stack &amp; 3D Web</text>
  <text x="216" y="32" font-size="8" fill="#7c9682">React 19 · FastAPI · Three.js</text>

  <rect x="0" y="52" width="190" height="42" rx="8" fill="rgba(255,255,255,0.025)" stroke="rgba(0,255,65,0.16)" stroke-width=".7"/>
  <text x="12" y="69" font-size="9" fill="#e8e8e8" font-weight="700">Cloud &amp; Databases</text>
  <text x="12" y="84" font-size="8" fill="#7c9682">AWS · Supabase · MongoDB</text>

  <rect x="204" y="52" width="190" height="42" rx="8" fill="rgba(255,255,255,0.025)" stroke="rgba(0,255,65,0.16)" stroke-width=".7"/>
  <text x="216" y="69" font-size="9" fill="#e8e8e8" font-weight="700">ML &amp; Computer Vision</text>
  <text x="216" y="84" font-size="8" fill="#7c9682">CNN · GAN · OpenCV · MediaPipe</text>

  <rect x="0" y="104" width="394" height="36" rx="8" fill="rgba(0,255,65,0.04)" stroke="rgba(0,255,65,0.22)" stroke-width=".7"/>
  <circle cx="16" cy="122" r="3.5" fill="#00ff41" class="pl"/>
  <text x="28" y="125" font-size="8.5" fill="#d0d0d0">Current Objective: <tspan fill="#00ff41" font-weight="700">Shipping production AI + Full-Stack systems</tspan></text>
</g>
</svg>