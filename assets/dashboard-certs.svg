  <rect x="12" y="8" width="1176" height="234" rx="14" fill="url(#ambient)"/>
  <line x1="26" y1="8.5" x2="1174" y2="8.5" stroke="#ffffff" stroke-opacity=".18" stroke-width=".7"/>
