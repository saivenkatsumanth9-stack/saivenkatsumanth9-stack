<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 350">
  <defs>
    <!-- Styles -->
    <style>
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      .blink { animation: blink 1s step-end infinite; }
      
      @keyframes float1 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      .float-1 { animation: float1 4s ease-in-out infinite; }
      
      @keyframes float2 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
      .float-2 { animation: float2 5s ease-in-out infinite 1s; }
      
      @keyframes float3 { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
      .float-3 { animation: float3 4.5s ease-in-out infinite 0.5s; }
      
      @keyframes steam { 
        0% { transform: translateY(0) scale(1); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-15px) scale(1.5); opacity: 0; }
      }
      .steam-1 { animation: steam 3s linear infinite; }
      .steam-2 { animation: steam 3s linear infinite 1s; }
      .steam-3 { animation: steam 3s linear infinite 2s; }
      
      @keyframes bar1 { 0%, 100% { width: 30px; } 50% { width: 45px; } }
      .bar-anim-1 { animation: bar1 3s ease-in-out infinite; }
      
      @keyframes bar2 { 0%, 100% { width: 40px; } 50% { width: 25px; } }
      .bar-anim-2 { animation: bar2 2s ease-in-out infinite; }
      
      @keyframes bar3 { 0%, 100% { width: 20px; } 50% { width: 35px; } }
      .bar-anim-3 { animation: bar3 4s ease-in-out infinite; }
      
      @keyframes rgbGlow { 
        0% { stop-color: #22c55e; }
        33% { stop-color: #06b6d4; }
        66% { stop-color: #a855f7; }
        100% { stop-color: #22c55e; }
      }
      .rgb-stop-1 { animation: rgbGlow 6s linear infinite; }
      .rgb-stop-2 { animation: rgbGlow 6s linear infinite -2s; }
      
      @keyframes particleUp {
        0% { transform: translateY(0); opacity: 0; }
        20% { opacity: 0.6; }
        80% { opacity: 0.6; }
        100% { transform: translateY(-40px); opacity: 0; }
      }
      .particle { animation: particleUp 5s linear infinite; }
    </style>
    
    <!-- Gradients -->
    <linearGradient id="rgbUnderglow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" class="rgb-stop-1" />
      <stop offset="100%" class="rgb-stop-2" />
    </linearGradient>
    
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>
    
    <linearGradient id="cyanFade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#080a10" />

  <!-- Global Iso Group -->
  <g transform="translate(440, 200)">
    
    <!-- Floor Grid -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)" stroke="#1e293b" stroke-width="0.5" opacity="0.4">
      <line x1="-300" y1="-200" x2="300" y2="-200" />
      <line x1="-300" y1="-100" x2="300" y2="-100" />
      <line x1="-300" y1="0" x2="300" y2="0" />
      <line x1="-300" y1="100" x2="300" y2="100" />
      <line x1="-300" y1="200" x2="300" y2="200" />
      
      <line x1="-200" y1="-300" x2="-200" y2="300" />
      <line x1="-100" y1="-300" x2="-100" y2="300" />
      <line x1="0" y1="-300" x2="0" y2="300" />
      <line x1="100" y1="-300" x2="100" y2="300" />
      <line x1="200" y1="-300" x2="200" y2="300" />
    </g>

    <!-- DESK -->
    <!-- Desk Left Side (XZ Plane at Y=100) -->
    <g transform="translate(-86.6, 50)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-160" y="-10" width="320" height="10" fill="#06090f" stroke="#06b6d4" stroke-width="0.5"/>
      </g>
    </g>
    <!-- Desk Right Side (YZ Plane at X=160) -->
    <g transform="translate(138.56, 80)">
      <g transform="matrix(-0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-100" y="-10" width="200" height="10" fill="#080c14" stroke="#06b6d4" stroke-width="0.5"/>
      </g>
    </g>
    <!-- Desk Top (Top Plane at Z=0) -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
      <rect x="-160" y="-100" width="320" height="200" fill="#0a0f1a" stroke="#06b6d4" stroke-width="1.5"/>
    </g>


    <!-- MUG (Right side) -->
    <!-- Base ellipse -->
    <ellipse cx="43.3" cy="85" rx="8.66" ry="5" fill="#0f1422" stroke="#06b6d4" stroke-width="1" />
    <!-- Mug Body -->
    <rect x="34.64" y="70" width="17.32" height="15" fill="#0f1422" />
    <path d="M 34.64 70 L 34.64 85 M 51.96 70 L 51.96 85" stroke="#06b6d4" stroke-width="1" />
    <!-- Top ellipse -->
    <ellipse cx="43.3" cy="70" rx="8.66" ry="5" fill="#0a0f1a" stroke="#06b6d4" stroke-width="1.5" />
    <!-- Coffee liquid -->
    <ellipse cx="43.3" cy="71" rx="6.5" ry="3.5" fill="#332211" />
    <!-- Steam -->
    <g stroke="#64748b" stroke-width="1.5" fill="none" stroke-linecap="round">
      <path d="M 40 68 Q 44 62 40 56 T 44 44" class="steam-1" />
      <path d="M 44 67 Q 40 61 44 55 T 40 43" class="steam-2" />
      <path d="M 47 69 Q 51 63 47 57 T 51 45" class="steam-3" />
    </g>

    <!-- KEYBOARD -->
    <!-- Base (Top Plane at Z=0) -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
      <rect x="-30" y="40" width="100" height="40" fill="#0f1422" stroke="url(#rgbUnderglow)" stroke-width="1.5" rx="2" filter="url(#neonGlow)"/>
      <!-- Keys -->
      <rect x="-25" y="45" width="90" height="6" fill="#1e293b" rx="1"/>
      <rect x="-25" y="55" width="90" height="6" fill="#1e293b" rx="1"/>
      <rect x="-25" y="65" width="20" height="6" fill="#1e293b" rx="1"/>
      <rect x="0" y="65" width="40" height="6" fill="#334155" rx="1"/>
      <rect x="45" y="65" width="20" height="6" fill="#1e293b" rx="1"/>
    </g>

    <!-- LAPTOP -->
    <!-- Laptop Base (Top Plane at Z=0) -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
      <rect x="-120" y="20" width="70" height="60" fill="#0f1422" stroke="#334155" stroke-width="1.5" rx="2" />
      <rect x="-115" y="25" width="60" height="30" fill="#0a0f1a" rx="1"/>
      <rect x="-95" y="60" width="20" height="15" fill="#1e293b" rx="1"/>
    </g>
    <!-- Laptop Screen Edge -->
    <!-- Left edge of screen (YZ plane at X=-120) -->
    <g transform="translate(-103.92, -60)">
      <g transform="matrix(-0.866, 0.5, 0, -1, 0, 0)">
        <rect x="20" y="0" width="3" height="50" fill="#0a0f1a" stroke="#06b6d4" stroke-width="0.5"/>
      </g>
    </g>
    <!-- Laptop Screen Front (XZ Plane at Y=20) -->
    <!-- x_proj = -20*0.866 = -17.32, y_proj = 20*0.5 = 10 -->
    <g transform="translate(-17.32, 10)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-120" y="0" width="70" height="50" fill="#0a0f1a" stroke="#06b6d4" stroke-width="1.5" rx="1" />
        <rect x="-120" y="0" width="70" height="50" fill="url(#screenGlow)" />
        
        <!-- Laptop Screen Code/Minimap -->
        <rect x="-110" y="35" width="10" height="3" fill="#22c55e" rx="1"/>
        <rect x="-95" y="35" width="20" height="3" fill="#94a3b8" rx="1"/>
        
        <rect x="-110" y="28" width="15" height="3" fill="#06b6d4" rx="1"/>
        <rect x="-90" y="28" width="25" height="3" fill="#a855f7" rx="1"/>
        
        <rect x="-110" y="21" width="30" height="3" fill="#22c55e" rx="1"/>
        <rect x="-75" y="21" width="15" height="3" fill="#94a3b8" rx="1"/>
        
        <rect x="-110" y="14" width="40" height="3" fill="#06b6d4" rx="1"/>
        
        <rect x="-110" y="7" width="20" height="3" fill="#a855f7" rx="1"/>
        <rect x="-85" y="7" width="10" height="3" fill="#22c55e" rx="1" class="blink"/>
      </g>
    </g>

    <!-- MAIN MONITOR -->
    <!-- Stand Base -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
      <rect x="10" y="-60" width="40" height="30" fill="#0f1422" stroke="#334155" stroke-width="1" rx="1"/>
    </g>
    <!-- Stand Pillar -->
    <!-- XZ Plane at Y=-40 -->
    <g transform="translate(34.64, -20)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="25" y="0" width="10" height="40" fill="#0a0f1a" stroke="#1e293b" stroke-width="0.5"/>
      </g>
    </g>
    
    <!-- Monitor Back (Top Plane at Z=110 for top edge) -->
    <g transform="translate(0, -110)">
      <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
        <rect x="-35" y="-55" width="130" height="10" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      </g>
    </g>
    <!-- Monitor Right Edge (YZ Plane at X=95) -->
    <g transform="translate(82.27, 47.5)">
      <g transform="matrix(-0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-55" y="30" width="10" height="80" fill="#0f1422" stroke="#334155" stroke-width="0.5"/>
      </g>
    </g>

    <!-- Monitor Screen Front (XZ Plane at Y=-45) -->
    <!-- y = -45 -> proj_x = 38.97, proj_y = -22.5 -->
    <g transform="translate(38.97, -22.5)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-35" y="30" width="130" height="80" fill="#0a0f1a" stroke="#22c55e" stroke-width="1.5" rx="2"/>
        <rect x="-35" y="30" width="130" height="80" fill="url(#screenGlow)" rx="2"/>
        
        <!-- Code Editor Content -->
        <rect x="-20" y="90" width="40" height="5" fill="#a855f7" rx="2" />
        <rect x="25" y="90" width="30" height="5" fill="#94a3b8" rx="2" />
        
        <rect x="-20" y="78" width="60" height="5" fill="#06b6d4" rx="2" />
        
        <rect x="-10" y="66" width="30" height="5" fill="#22c55e" rx="2" />
        <rect x="25" y="66" width="40" height="5" fill="#94a3b8" rx="2" />
        
        <rect x="-10" y="54" width="70" height="5" fill="#06b6d4" rx="2" />
        
        <rect x="-20" y="42" width="50" height="5" fill="#22c55e" rx="2" />
        <rect x="35" y="42" width="6" height="6" fill="#22c55e" rx="1" class="blink"/>
      </g>
    </g>

    <!-- SECONDARY MONITOR -->
    <!-- Stand Base -->
    <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
      <rect x="120" y="-60" width="30" height="20" fill="#0f1422" stroke="#334155" stroke-width="1" rx="1"/>
    </g>
    <!-- Stand Pillar -->
    <!-- XZ Plane at Y=-45 -->
    <g transform="translate(38.97, -22.5)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="130" y="0" width="10" height="30" fill="#0a0f1a" stroke="#1e293b" stroke-width="0.5"/>
      </g>
    </g>

    <!-- Monitor Top Edge (Top Plane at Z=130) -->
    <g transform="translate(0, -130)">
      <g transform="matrix(0.866, 0.5, -0.866, 0.5, 0, 0)">
        <rect x="110" y="-55" width="50" height="10" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
      </g>
    </g>
    <!-- Monitor Right Edge (YZ Plane at X=160) -->
    <g transform="translate(138.56, 80)">
      <g transform="matrix(-0.866, 0.5, 0, -1, 0, 0)">
        <rect x="-55" y="30" width="10" height="100" fill="#0f1422" stroke="#334155" stroke-width="0.5"/>
      </g>
    </g>

    <!-- Monitor Screen Front (XZ Plane at Y=-45) -->
    <g transform="translate(38.97, -22.5)">
      <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
        <rect x="110" y="30" width="50" height="100" fill="#0a0f1a" stroke="#06b6d4" stroke-width="1.5" rx="2"/>
        <rect x="110" y="30" width="50" height="100" fill="url(#screenGlow)" rx="2"/>
        
        <!-- Dashboard Bars -->
        <!-- Y mapping to Z is up. Top is 130, bottom is 30 -->
        <rect x="115" y="115" width="40" height="6" fill="#1e293b" rx="2"/>
        <rect x="115" y="115" width="30" height="6" fill="#06b6d4" rx="2" class="bar-anim-1"/>
        
        <rect x="115" y="100" width="40" height="6" fill="#1e293b" rx="2"/>
        <rect x="115" y="100" width="25" height="6" fill="#22c55e" rx="2" class="bar-anim-2"/>
        
        <rect x="115" y="85" width="40" height="6" fill="#1e293b" rx="2"/>
        <rect x="115" y="85" width="20" height="6" fill="#a855f7" rx="2" class="bar-anim-3"/>
        
        <!-- Area Graph -->
        <path d="M 115 50 L 125 60 L 135 45 L 145 65 L 155 55 L 155 35 L 115 35 Z" fill="url(#cyanFade)" />
        <path d="M 115 50 L 125 60 L 135 45 L 145 65 L 155 55" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
      </g>
    </g>

    <!-- FLOATING WINDOWS -->
    <!-- Window 1: [ API ] -->
    <g class="float-1">
      <!-- XZ Plane at Y=-60 -> 60*0.866=51.96, -30 -->
      <g transform="translate(51.96, -30)">
        <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
          <rect x="-40" y="150" width="45" height="20" fill="#0a0f1a" stroke="#22c55e" stroke-width="1" rx="2" fill-opacity="0.9" filter="url(#neonGlow)"/>
          <g transform="scale(1, -1)">
            <text x="-17.5" y="-156" fill="#22c55e" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">[ API ]</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Window 2: [ DATA ] -->
    <g class="float-2">
      <!-- XZ Plane at Y=-50 -> 43.3, -25 -->
      <g transform="translate(43.3, -25)">
        <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
          <rect x="60" y="160" width="55" height="20" fill="#0a0f1a" stroke="#06b6d4" stroke-width="1" rx="2" fill-opacity="0.9" filter="url(#neonGlow)"/>
          <g transform="scale(1, -1)">
            <text x="87.5" y="-166" fill="#06b6d4" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">[ DATA ]</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Window 3: [ AUTH ] -->
    <g class="float-3">
      <!-- XZ Plane at Y=-40 -> 34.64, -20 -->
      <g transform="translate(34.64, -20)">
        <g transform="matrix(0.866, 0.5, 0, -1, 0, 0)">
          <rect x="150" y="140" width="55" height="20" fill="#0a0f1a" stroke="#a855f7" stroke-width="1" rx="2" fill-opacity="0.9" filter="url(#neonGlow)"/>
          <g transform="scale(1, -1)">
            <text x="177.5" y="-146" fill="#a855f7" font-size="10" font-family="monospace" text-anchor="middle" font-weight="bold">[ AUTH ]</text>
          </g>
        </g>
      </g>
    </g>

    <!-- Ambient Particles -->
    <!-- Spread across 2D plane -->
    <g fill="#06b6d4" opacity="0">
      <circle cx="-150" cy="50" r="1.5" class="particle" style="animation-delay: 0s" />
      <circle cx="150" cy="-50" r="2" class="particle" style="animation-delay: 1.2s" fill="#22c55e" />
      <circle cx="0" cy="80" r="1.5" class="particle" style="animation-delay: 2.5s" fill="#a855f7" />
      <circle cx="-50" cy="-100" r="2" class="particle" style="animation-delay: 3.8s" />
      <circle cx="200" cy="20" r="1.5" class="particle" style="animation-delay: 0.5s" fill="#22c55e" />
      <circle cx="80" cy="120" r="1" class="particle" style="animation-delay: 4.1s" />
    </g>

  </g>

  <!-- Bottom Text -->
  <text x="440" y="330" fill="#64748b" font-size="11" font-family="monospace" text-anchor="middle" font-weight="bold" letter-spacing="2">&gt; WORKSPACE_INITIALIZED // ALL_SYSTEMS_ACTIVE</text>

</svg>
