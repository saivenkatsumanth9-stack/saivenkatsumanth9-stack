<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200">
<defs>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&amp;display=swap');
text{font-family:'JetBrains Mono','Fira Code',monospace}
@keyframes scanline{0%{transform:translateY(-200px)}100%{transform:translateY(200px)}}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes barAnim1{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes barAnim2{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(.3)}}
@keyframes barAnim3{0%,100%{transform:scaleY(.5)}50%{transform:scaleY(.85)}}
@keyframes barAnim4{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(.5)}}
@keyframes barAnim5{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(.95)}}
@keyframes barAnim6{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(.4)}}
@keyframes barAnim7{0%,100%{transform:scaleY(.55)}50%{transform:scaleY(.9)}}
@keyframes dotPulse{0%,100%{r:1.5;opacity:.3}50%{r:2.5;opacity:.8}}
@keyframes lineGrow{0%{stroke-dashoffset:300}100%{stroke-dashoffset:0}}
.sl{animation:scanline 6s linear infinite;opacity:.03}
.p{animation:pulse 2s ease-in-out infinite}
.b1{animation:barAnim1 3s ease-in-out infinite;transform-origin:center bottom}
.b2{animation:barAnim2 3.5s ease-in-out infinite .3s;transform-origin:center bottom}
.b3{animation:barAnim3 2.8s ease-in-out infinite .6s;transform-origin:center bottom}
.b4{animation:barAnim4 3.2s ease-in-out infinite .9s;transform-origin:center bottom}
.b5{animation:barAnim5 3.8s ease-in-out infinite 1.2s;transform-origin:center bottom}
.b6{animation:barAnim6 2.5s ease-in-out infinite 1.5s;transform-origin:center bottom}
.b7{animation:barAnim7 3.4s ease-in-out infinite 1.8s;transform-origin:center bottom}
.dp{animation:dotPulse 2.5s ease-in-out infinite}
.lg{stroke-dasharray:300;animation:lineGrow 4s ease-in-out infinite}
</style>
</defs>

<!-- Background -->
<rect width="1200" height="200" fill="#0a0a0a"/>

<!-- Subtle grid -->
<g opacity=".04">
<line x1="0" y1="40" x2="1200" y2="40" stroke="#00ff41" stroke-width=".5"/>
<line x1="0" y1="80" x2="1200" y2="80" stroke="#00ff41" stroke-width=".5"/>
<line x1="0" y1="120" x2="1200" y2="120" stroke="#00ff41" stroke-width=".5"/>
<line x1="0" y1="160" x2="1200" y2="160" stroke="#00ff41" stroke-width=".5"/>
<line x1="40" y1="0" x2="40" y2="200" stroke="#00ff41" stroke-width=".5"/>
<line x1="80" y1="0" x2="80" y2="200" stroke="#00ff41" stroke-width=".5"/>
<line x1="120" y1="0" x2="120" y2="200" stroke="#00ff41" stroke-width=".5"/>
<line x1="160" y1="0" x2="160" y2="200" stroke="#00ff41" stroke-width=".5"/>
<line x1="200" y1="0" x2="200" y2="200" stroke="#00ff41" stroke-width=".5"/>
</g>

<!-- Scanline -->
<rect x="0" y="0" width="1200" height="3" fill="#00ff41" class="sl"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1200" height="1.5" fill="#00ff41" opacity=".5"/>

<!-- Panel: Tech Stack Visualization -->
<rect x="20" y="15" width="350" height="170" rx="8" fill="rgba(12,12,12,.9)" stroke="rgba(0,255,65,.12)" stroke-width="1"/>
<text x="35" y="35" font-size="8" fill="#555" letter-spacing="2">TECH_ECOSYSTEM</text>
<text x="35" y="48" font-size="10" fill="#00ff41" font-weight="700">Technology Matrix</text>

<!-- Language bars -->
<g transform="translate(40, 60)">
<text x="0" y="8" font-size="7" fill="#888">Python</text><rect x="55" y="1" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="1" width="105" height="8" rx="2" fill="#00ff41" opacity=".7"/>
<text x="0" y="22" font-size="7" fill="#888">Java</text><rect x="55" y="15" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="15" width="80" height="8" rx="2" fill="#00ff41" opacity=".55"/>
<text x="0" y="36" font-size="7" fill="#888">JS/TS</text><rect x="55" y="29" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="29" width="90" height="8" rx="2" fill="#00ff41" opacity=".6"/>
<text x="0" y="50" font-size="7" fill="#888">C/C++</text><rect x="55" y="43" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="43" width="65" height="8" rx="2" fill="#00ff41" opacity=".45"/>
<text x="0" y="64" font-size="7" fill="#888">SQL</text><rect x="55" y="57" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="57" width="75" height="8" rx="2" fill="#00ff41" opacity=".5"/>
<text x="0" y="78" font-size="7" fill="#888">C#</text><rect x="55" y="71" width="120" height="8" rx="2" fill="rgba(0,255,65,.08)"/><rect x="55" y="71" width="55" height="8" rx="2" fill="#00ff41" opacity=".4"/>
</g>

<text x="40" y="165" font-size="6" fill="#444">▸ 10+ languages · 20+ frameworks</text>

<!-- Panel: Coding Activity -->
<rect x="390" y="15" width="400" height="170" rx="8" fill="rgba(12,12,12,.9)" stroke="rgba(0,255,65,.12)" stroke-width="1"/>
<text x="405" y="35" font-size="8" fill="#555" letter-spacing="2">ACTIVITY_MONITOR</text>
<text x="405" y="48" font-size="10" fill="#00ff41" font-weight="700">Coding Activity</text>

<!-- Activity bars -->
<g transform="translate(415, 60)">
<rect class="b1" x="0" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".3"/>
<rect class="b2" x="22" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".35"/>
<rect class="b3" x="44" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".4"/>
<rect class="b4" x="66" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".3"/>
<rect class="b5" x="88" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".45"/>
<rect class="b6" x="110" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".35"/>
<rect class="b7" x="132" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".3"/>
<rect class="b1" x="154" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".5" style="animation-delay:2s"/>
<rect class="b3" x="176" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".35" style="animation-delay:1s"/>
<rect class="b5" x="198" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".4" style="animation-delay:.5s"/>
<rect class="b2" x="220" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".45" style="animation-delay:1.5s"/>
<rect class="b4" x="242" y="0" width="16" height="90" rx="2" fill="#00ff41" opacity=".3" style="animation-delay:.8s"/>
<!-- Labels -->
<text x="8" y="102" text-anchor="middle" font-size="5" fill="#555">J</text>
<text x="30" y="102" text-anchor="middle" font-size="5" fill="#555">F</text>
<text x="52" y="102" text-anchor="middle" font-size="5" fill="#555">M</text>
<text x="74" y="102" text-anchor="middle" font-size="5" fill="#555">A</text>
<text x="96" y="102" text-anchor="middle" font-size="5" fill="#555">M</text>
<text x="118" y="102" text-anchor="middle" font-size="5" fill="#555">J</text>
<text x="140" y="102" text-anchor="middle" font-size="5" fill="#555">J</text>
<text x="162" y="102" text-anchor="middle" font-size="5" fill="#555">A</text>
<text x="184" y="102" text-anchor="middle" font-size="5" fill="#555">S</text>
<text x="206" y="102" text-anchor="middle" font-size="5" fill="#555">O</text>
<text x="228" y="102" text-anchor="middle" font-size="5" fill="#555">N</text>
<text x="250" y="102" text-anchor="middle" font-size="5" fill="#555">D</text>
</g>

<!-- Trend line overlay -->
<polyline points="423,120 445,105 467,110 489,95 511,100 533,80 555,85 577,70 599,78 621,65 643,72 665,55" fill="none" stroke="#00ff41" stroke-width="1.2" opacity=".6" class="lg"/>
<g opacity=".5">
<circle cx="423" cy="120" r="1.5" fill="#00ff41" class="dp"/>
<circle cx="489" cy="95" r="1.5" fill="#00ff41" class="dp" style="animation-delay:.5s"/>
<circle cx="555" cy="85" r="1.5" fill="#00ff41" class="dp" style="animation-delay:1s"/>
<circle cx="621" cy="65" r="1.5" fill="#00ff41" class="dp" style="animation-delay:1.5s"/>
<circle cx="665" cy="55" r="1.5" fill="#00ff41" class="dp" style="animation-delay:2s"/>
</g>

<!-- Panel: Contribution Trend -->
<rect x="810" y="15" width="370" height="170" rx="8" fill="rgba(12,12,12,.9)" stroke="rgba(0,255,65,.12)" stroke-width="1"/>
<text x="825" y="35" font-size="8" fill="#555" letter-spacing="2">CONTRIBUTION_STREAM</text>
<text x="825" y="48" font-size="10" fill="#00ff41" font-weight="700">Growth Trajectory</text>

<!-- Area chart -->
<g transform="translate(830, 55)">
<polygon points="0,100 10,92 25,88 40,80 55,85 70,72 85,68 100,60 115,65 130,52 145,48 160,40 175,45 190,35 205,30 220,38 235,28 250,22 265,30 280,18 295,15 310,20 325,10 325,100" fill="rgba(0,255,65,.06)" stroke="none"/>
<polyline points="0,100 10,92 25,88 40,80 55,85 70,72 85,68 100,60 115,65 130,52 145,48 160,40 175,45 190,35 205,30 220,38 235,28 250,22 265,30 280,18 295,15 310,20 325,10" fill="none" stroke="#00ff41" stroke-width="1.5" opacity=".7" class="lg"/>
<!-- Dots at key points -->
<circle cx="100" cy="60" r="2" fill="#00ff41" class="dp" style="animation-delay:.3s"/>
<circle cx="190" cy="35" r="2" fill="#00ff41" class="dp" style="animation-delay:.8s"/>
<circle cx="280" cy="18" r="2" fill="#00ff41" class="dp" style="animation-delay:1.3s"/>
<circle cx="325" cy="10" r="2" fill="#00ff41" class="dp" style="animation-delay:1.8s"/>
</g>

<!-- Stats at bottom -->
<g transform="translate(840, 162)">
<text x="0" y="0" font-size="6.5" fill="#555">▸ contributions growing</text>
<text x="145" y="0" font-size="6.5" fill="#00ff41" font-weight="700">+42%</text>
<text x="195" y="0" font-size="6.5" fill="#555">this year</text>
</g>

<!-- Bottom accent -->
<rect x="0" y="198" width="1200" height="2" fill="#00ff41" opacity=".15"/>
</svg>
